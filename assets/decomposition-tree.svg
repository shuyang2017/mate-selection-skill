<svg viewBox="0 0 680 540" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>婚恋择偶第一性原理拆解树</title>
<desc>从本质目标出发，分解为公理、5个核心维度、4个结构性约束，再推出行动。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="540" fill="#ffffff"/>
<text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">婚恋择偶 · 第一性原理拆解树</text>

<rect x="160" y="40" width="360" height="48" rx="12" fill="#E6F1FB" stroke="#185FA5"/>
<text x="340" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#042C53">择偶的本质：选择长期人生合伙人</text>

<path d="M340 88 L340 104 L185 104 L185 120" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M340 104 L495 104 L495 120" fill="none" stroke="#B4B2A9" stroke-width="1"/>

<rect x="50" y="120" width="270" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5"/>
<text x="185" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#042C53">公理① 功能</text>
<text x="185" y="161" text-anchor="middle" font-size="11" fill="#0C447C">共担风险 · 分工 · 相互照料 · 养育</text>

<rect x="360" y="120" width="270" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5"/>
<text x="495" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#042C53">公理② 目标函数</text>
<text x="495" y="161" text-anchor="middle" font-size="11" fill="#0C447C">最大化终身合伙价值，非"看着厉害"</text>

<text x="340" y="200" text-anchor="middle" font-size="12" fill="#444441">由此拆解：不可再分的 5 个核心维度</text>

<path d="M185 176 L185 210" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M495 176 L495 210" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M96 210 L584 210" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M96 210 L96 224" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M218 210 L218 224" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M340 210 L340 224" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M462 210 L462 224" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M584 210 L584 224" fill="none" stroke="#B4B2A9" stroke-width="1"/>

<rect x="40" y="224" width="112" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="96" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#173404">价值 /</text>
<text x="96" y="263" text-anchor="middle" font-size="11" fill="#27500A">目标契合</text>

<rect x="162" y="224" width="112" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="218" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#173404">关系机制</text>
<text x="218" y="263" text-anchor="middle" font-size="11" fill="#27500A">(冲突修复)</text>

<rect x="284" y="224" width="112" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="340" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#173404">相互</text>
<text x="340" y="263" text-anchor="middle" font-size="11" fill="#27500A">吸引力</text>

<rect x="406" y="224" width="112" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="462" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#173404">品格 /</text>
<text x="462" y="263" text-anchor="middle" font-size="11" fill="#27500A">可靠</text>

<rect x="528" y="224" width="112" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="584" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#173404">互补性</text>
<text x="584" y="263" text-anchor="middle" font-size="11" fill="#27500A">(长短板互补)</text>

<text x="340" y="300" text-anchor="middle" font-size="12" fill="#444441">必须正视的 4 个结构性约束</text>

<path d="M340 280 L340 312" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M105 312 L573 312" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M105 312 L105 330" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M261 312 L261 330" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M417 312 L417 330" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M573 312 L573 330" fill="none" stroke="#B4B2A9" stroke-width="1"/>

<rect x="40" y="330" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="105" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#412402">接触面约束</text>
<text x="105" y="369" text-anchor="middle" font-size="11" fill="#633806">只能选遇得到的</text>

<rect x="196" y="330" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="261" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#412402">双边约束</text>
<text x="261" y="369" text-anchor="middle" font-size="11" fill="#633806">你也被对方选</text>

<rect x="352" y="330" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="417" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#412402">时间 / 信息</text>
<text x="417" y="369" text-anchor="middle" font-size="11" fill="#633806">信号可被伪装</text>

<rect x="508" y="330" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="573" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#412402">维度权衡</text>
<text x="573" y="369" text-anchor="middle" font-size="11" fill="#633806">无人全项满分</text>

<text x="340" y="414" text-anchor="middle" font-size="12" fill="#444441">从第一性原理推出的行动</text>

<path d="M340 386 L340 420" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M96 420 L584 420" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M96 420 L96 436" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M218 420 L218 436" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M340 420 L340 436" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M462 420 L462 436" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<path d="M584 420 L584 436" fill="none" stroke="#B4B2A9" stroke-width="1"/>

<rect x="40" y="436" width="112" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="96" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">扩大并提升</text>
<text x="96" y="475" text-anchor="middle" font-size="11" fill="#3C3489">候选池质量</text>

<rect x="162" y="436" width="112" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="218" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">投资成为</text>
<text x="218" y="475" text-anchor="middle" font-size="11" fill="#3C3489">更好的伴侣</text>

<rect x="284" y="436" width="112" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="340" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">聚焦核心</text>
<text x="340" y="475" text-anchor="middle" font-size="11" fill="#3C3489">维度</text>

<rect x="406" y="436" width="112" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="462" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">前置排查</text>
<text x="462" y="475" text-anchor="middle" font-size="11" fill="#3C3489">硬性分歧</text>

<rect x="528" y="436" width="112" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="584" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">适时承诺</text>
<text x="584" y="475" text-anchor="middle" font-size="11" fill="#3C3489">停止搜寻</text>

<text x="340" y="515" text-anchor="middle" font-size="11" fill="#5F5E5A">代理指标(收入/房车/身高)与核心维度相关度有限，别本末倒置</text>
</svg>
